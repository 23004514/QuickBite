<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | QuickBite</title>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/reset-password.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <div class="auth-card">
        <div id="form-msg" class="form-msg" role="alert" hidden></div>

        <section id="request-panel">
          <h1>Reset your password</h1>
          <p class="muted">Enter your email and we'll send you a reset link.</p>
          <form id="request-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <button class="btn btn--block" type="submit">Send reset link</button>
          </form>
          <div class="auth-links"><a href="/login.html">Back to log in</a></div>
        </section>

        <section id="update-panel" hidden>
          <h1>Choose a new password</h1>
          <form id="update-form" novalidate>
            <div class="field">
              <label for="password">New password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
              <span class="hint">At least 8 characters.</span>
            </div>
            <div class="field">
              <label for="confirm">Confirm new password</label>
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
            </div>
            <button class="btn btn--block" type="submit">Update password</button>
          </form>
        </section>
      </div>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
