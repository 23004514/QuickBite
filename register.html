<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | QuickBite</title>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/register.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="muted">It takes a minute and lets you order and track meals.</p>
        <div id="form-msg" class="form-msg" role="alert" hidden></div>
        <form id="register-form" novalidate>
          <div class="field">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" autocomplete="name" maxlength="100" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <span class="hint">At least 8 characters.</span>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
          </div>
          <button class="btn btn--block" type="submit">Create account</button>
        </form>
        <div class="auth-links">
          <span>Already registered?</span>
          <a id="login-link" href="/login.html">Log in</a>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
